# 仅技术支路（清晰度）的 Mobile 推理配置。美学支路不加载、不采样。
name: DOVER-Mobile-Clarity
num_epochs: 0
l_num_epochs: 0
warmup_epochs: 0
ema: false
save_model: false
batch_size: 1
num_workers: 0
split_seed: 42

data:
  clarity:
    type: ViewDecompositionDataset
    args:
      phase: test
      sample_types:
        technical:
          fragments_h: 7
          fragments_w: 7
          fsize_h: 32
          fsize_w: 32
          aligned: 32
          clip_len: 32
          frame_interval: 2
          num_clips: 3

model:
  type: DOVER
  args:
    backbone:
      technical:
        type: conv_femto
    backbone_preserve_keys: technical
    divide_head: true
    vqa_head:
      in_channels: 384
      hidden_channels: 32

test_load_path: ./pretrained_weights/DOVER-Mobile.pth
