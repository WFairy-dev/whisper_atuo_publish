# 文字识别服务配置。改完后需要重启服务才生效。
# 环境变量 OCR_DET_BATCH / OCR_REC_BATCH / OCR_MAX_WORKERS 若已设置，会临时覆盖这里的数值。

# 一次送进检测模型的图片数。2026-10-28 实测：批大小 4 比 1、8、16 更快，显存仍只有大约 2GB。
det_batch = 4

# 一次送进识别模型的文字小块数。实测 16 比 1 快，再加大到 32 或 64 反而变慢。
rec_batch = 16

# 同时识别的路数。每一路各加载一套检测和识别模型，空闲的那一路领下一个任务。
# 每一路内部仍按上面的批大小计算。当前 3 路。服务最多按 3 路启动。
# 2026-10-28 实测：两组各 32 张，一路排队约 4.9 秒，两路同时约 2.7 秒。三路速度还没测。
workers = 3
